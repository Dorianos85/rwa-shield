[package]
name = "poster"
version = "0.1.0"
description = "Off-chain poster for ecv_oracle: reads /api/ecv, encodes, posts"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Program crate for the on-chain types (EcvRecord layout is the spec).
# `no-entrypoint` so the program's entrypoint symbol is not linked into a host binary.
ecv_oracle = { path = "../programs/ecv_oracle", features = ["no-entrypoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
